<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Circle Clip -->
    <clipPath id="avatarDiscClip">
      <circle cx="200" cy="200" r="190" />
    </clipPath>

    <!-- 3D Theme Backdrop: LabTutor Emerald Gradient -->
    <radialGradient id="themeBg3D" cx="28%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="30%" stop-color="#A7F3D0" />
      <stop offset="65%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- 3D Face Skin Gradient (Soft cinematic 3D studio light) -->
    <radialGradient id="skin3D" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#FFEADE" />
      <stop offset="40%" stop-color="#FCD2BD" />
      <stop offset="80%" stop-color="#F2B397" />
      <stop offset="100%" stop-color="#DE9678" />
    </radialGradient>

    <!-- 3D Neck Shadow -->
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5775B" />
      <stop offset="35%" stop-color="#D98A6C" />
      <stop offset="100%" stop-color="#F2B397" />
    </linearGradient>

    <!-- 3D Hair Volumetric Gradient -->
    <radialGradient id="hairVol" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#4A3425" />
      <stop offset="45%" stop-color="#2E1E14" />
      <stop offset="85%" stop-color="#1A1009" />
      <stop offset="100%" stop-color="#0D0704" />
    </radialGradient>
    <linearGradient id="hairSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6246" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#4A3425" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1A1009" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Attire: LabTutor Medical Emerald Smart Casual Knit -->
    <radialGradient id="knit3D" cx="30%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="25%" stop-color="#10B981" />
      <stop offset="65%" stop-color="#059669" />
      <stop offset="90%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>

    <!-- Collar Trim Highlight -->
    <linearGradient id="collarEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Soft 3D Drop Shadow -->
    <filter id="bustShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064E3B" flood-opacity="0.3" />
    </filter>

    <!-- Nose 3D Soft Shadow -->
    <radialGradient id="noseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8664A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#B8664A" stop-opacity="0" />
    </radialGradient>
    
    <!-- Eye Iris Gradient -->
    <radialGradient id="irisGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4B3621" />
      <stop offset="70%" stop-color="#2A1B0E" />
      <stop offset="100%" stop-color="#120A05" />
    </radialGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="200" cy="200" r="193" fill="none" stroke="#34D399" stroke-width="4" opacity="0.6" />

  <!-- Clipped Disc Body -->
  <g clip-path="url(#avatarDiscClip)">
    <!-- 3D Theme Backdrop -->
    <rect width="400" height="400" fill="url(#themeBg3D)" />

    <!-- Ambient Sphere Light Source -->
    <circle cx="110" cy="100" r="130" fill="#FFFFFF" opacity="0.25" />

    <!-- 3D Shoulders & Torso -->
    <g filter="url(#bustShadow)">
      <path d="M60 385 C60 292 120 252 200 252 C280 252 340 292 340 385 C340 405 315 410 290 410 L110 410 C85 410 60 405 60 385 Z" fill="url(#knit3D)" />
      
      <!-- Shoulder Volume Highlights & Folds -->
      <path d="M65 385 C65 315 110 270 170 256 C140 275 105 320 90 385 Z" fill="#6EE7B7" opacity="0.3" />
      <path d="M335 385 C335 315 290 270 230 256 C260 275 295 320 310 385 Z" fill="#022C22" opacity="0.35" />
    </g>

    <!-- Smart V-Collar & Inner Shirt (Theme Mint) -->
    <path d="M174 252 L200 286 L226 252 Z" fill="#ECFDF5" />
    <!-- Collar Fold Left -->
    <path d="M162 250 L196 288 L200 284 L170 248 Z" fill="#059669" />
    <path d="M162 250 L196 288 L194 290 L160 251 Z" fill="url(#collarEdge)" opacity="0.8" />
    <!-- Collar Fold Right -->
    <path d="M238 250 L204 288 L200 284 L230 248 Z" fill="#047857" />

    <!-- 3D Neck -->
    <path d="M176 195 L176 264 C176 272 186 278 200 278 C214 278 224 272 224 264 L224 195 Z" fill="url(#neckGrad)" />

    <!-- 3D Ears with Inner Depth -->
    <g id="ears">
      <!-- Left Ear -->
      <ellipse cx="124" cy="186" rx="14" ry="19" fill="url(#skin3D)" />
      <ellipse cx="126" cy="186" rx="8" ry="11" fill="#DE9678" />
      <!-- Right Ear -->
      <ellipse cx="276" cy="186" rx="14" ry="19" fill="url(#skin3D)" />
      <ellipse cx="274" cy="186" rx="8" ry="11" fill="#C5775B" />
    </g>

    <!-- 3D Head Base -->
    <g id="head3D">
      <ellipse cx="200" cy="176" rx="72" ry="80" fill="url(#skin3D)" />

      <!-- 3D Forehead Specular Glow -->
      <ellipse cx="178" cy="138" rx="36" ry="22" fill="#FFFFFF" opacity="0.18" />

      <!-- Cheeks Healthy Soft 3D Blush -->
      <ellipse cx="152" cy="196" rx="18" ry="11" fill="#FB7185" opacity="0.16" />
      <ellipse cx="248" cy="196" rx="18" ry="11" fill="#FB7185" opacity="0.16" />

      <!-- Eyebrows (Sculpted modern arches) -->
      <path d="M148 155 Q164 148 180 152" stroke="#2A1B0E" stroke-width="4.2" stroke-linecap="round" fill="none" />
      <path d="M220 152 Q236 148 252 155" stroke="#2A1B0E" stroke-width="4.2" stroke-linecap="round" fill="none" />

      <!-- 3D Expressive Eyes -->
      <g id="eyes">
        <!-- Left Eye Socket & Sclera -->
        <ellipse cx="164" cy="174" rx="12" ry="11" fill="#FFFFFF" />
        <ellipse cx="164" cy="174" rx="8" ry="9" fill="url(#irisGrad)" />
        <circle cx="164" cy="174" r="4.5" fill="#000000" />
        <circle cx="161.5" cy="171" r="2.8" fill="#FFFFFF" />
        <circle cx="166" cy="176" r="1.2" fill="#FFFFFF" opacity="0.8" />
        <!-- Upper Eyelid curve -->
        <path d="M152 172 Q164 163 176 172" stroke="#2A1B0E" stroke-width="2.5" fill="none" stroke-linecap="round" />

        <!-- Right Eye Socket & Sclera -->
        <ellipse cx="236" cy="174" rx="12" ry="11" fill="#FFFFFF" />
        <ellipse cx="236" cy="174" rx="8" ry="9" fill="url(#irisGrad)" />
        <circle cx="236" cy="174" r="4.5" fill="#000000" />
        <circle cx="233.5" cy="171" r="2.8" fill="#FFFFFF" />
        <circle cx="238" cy="176" r="1.2" fill="#FFFFFF" opacity="0.8" />
        <!-- Upper Eyelid curve -->
        <path d="M224 172 Q236 163 248 172" stroke="#2A1B0E" stroke-width="2.5" fill="none" stroke-linecap="round" />
      </g>

      <!-- 3D Soft Shaded Nose (No harsh strokes, realistic 3D depth) -->
      <ellipse cx="200" cy="198" rx="8" ry="4" fill="url(#noseShadow)" />
      <path d="M198 165 Q196 190 193 195 Q200 198 207 195" stroke="#C5775B" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.6" />
      <circle cx="199" cy="193" r="2" fill="#FFFFFF" opacity="0.3" />

      <!-- Warm Friendly 3D Smile -->
      <path d="M178 214 Q200 232 222 214" stroke="#881337" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M182 215 Q200 227 218 215 Z" fill="#FFFFFF" />
      <path d="M184 218 Q200 230 216 218" stroke="#FB7185" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
    </g>

    <!-- 3D Volumetric Hair (Layered, textured, handsome modern professional cut) -->
    <g id="hairLayer">
      <!-- Back hair base -->
      <path d="M125 175 C120 115 145 88 200 88 C255 88 280 115 275 175 C268 135 250 108 200 108 C150 108 132 135 125 175 Z" fill="#1A1009" />

      <!-- Main Volume -->
      <path d="M124 168 C122 118 152 82 208 80 C268 78 282 115 276 168 C274 148 260 134 250 132 C236 104 190 100 152 118 C138 126 130 144 124 168 Z" fill="url(#hairVol)" />

      <!-- 3D Hair Strands & Highlights -->
      <path d="M140 128 C165 98 228 92 264 125 C246 110 198 108 162 128 Z" fill="url(#hairSheen)" />
      <path d="M172 90 Q215 88 248 114 C232 104 198 98 172 90 Z" fill="#8C6246" opacity="0.6" />
      <path d="M136 142 C148 126 172 118 190 116 C168 122 150 132 142 148 Z" fill="#8C6246" opacity="0.4" />
    </g>
  </g>

  <!-- Polished Double Ring Frame in Brand Emerald (#10B981 & #34D399) -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#10B981" stroke-width="3.5" />
  <circle cx="200" cy="200" r="187" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
</svg>