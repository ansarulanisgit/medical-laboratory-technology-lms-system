<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="circleClip">
      <circle cx="128" cy="128" r="128" />
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0AEC0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <radialGradient id="chinShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <g clip-path="url(#circleClip)">
    <!-- Background Circle -->
    <rect width="256" height="256" fill="url(#bgGrad)" />
    
    <!-- Torso / Shoulders -->
    <path d="M42 246 C42 186 82 164 128 164 C174 164 214 186 214 246 C214 256 204 256 190 256 L66 256 C52 256 42 256 42 246 Z" fill="url(#figureGrad)" />
    
    <!-- Neck Shadow -->
    <ellipse cx="128" cy="150" rx="24" ry="8" fill="url(#chinShadow)" />
    
    <!-- Head -->
    <circle cx="128" cy="98" r="46" fill="url(#headGrad)" />
  </g>
  
  <!-- Subtle Border -->
  <circle cx="128" cy="128" r="126" fill="none" stroke="#CBD5E1" stroke-width="2.5" />
</svg>